{% if messages %}
  <div class="position-fixed bottom-0 start-0 p-3" style="z-index: 1050">
    {% for msg in messages %}
      <div class="alert alert-{{ msg.tags }} alert-dismissible fade show mb-2 floating-alert text-dark" role="alert">
        {{ msg|safe }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endfor %}
  </div>
{% endif %}

<script>
  document.addEventListener('DOMContentLoaded', function () {
    // فقط alertهایی که کلاس floating-alert دارند بسته شوند
    setTimeout(function () {
      document.querySelectorAll('.floating-alert').forEach(function (el) {
        var alert = new bootstrap.Alert(el);
        alert.close();
      });
    }, 4000);
  });
</script>
